name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and ship all three sites even if their inputs are unchanged"
        type: boolean
        default: false

concurrency:
  group: deploy-dungeonmaster
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_BASE: /opt/dungeonmaster

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out what each site is built from
        run: |
          set -euo pipefail
          COMMON="package.json package-lock.json tsconfig.json"
          SITE_PATHS="apps/site packages/module packages/core $COMMON"
          STUDIO_PATHS="apps/editor packages/module packages/core packages/engine packages/authoring packages/mods packages/library packages/tools modules $COMMON"
          PLAY_PATHS="apps/play packages/play packages/module packages/core packages/engine packages/mods packages/library packages/tools modules $COMMON"

          hash_of() {
            for p in $2; do
              git cat-file -e "HEAD:$p" 2>/dev/null || {
                echo "::error::$1: input path '$p' does not exist at HEAD. Update the path list in this workflow."
                exit 1; }
            done
            git ls-tree -r HEAD -- $2 | sha256sum | cut -d' ' -f1
          }

          {
            echo "SITE_INPUTS=$(hash_of site "$SITE_PATHS")"
            echo "STUDIO_INPUTS=$(hash_of studio "$STUDIO_PATHS")"
            echo "PLAY_INPUTS=$(hash_of play "$PLAY_PATHS")"
            echo "RELEASE=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}"
            echo "GIT_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          JUMP_HOST: ${{ secrets.DEPLOY_JUMP_HOST }}
          JUMP_HOST_KEY: ${{ secrets.DEPLOY_JUMP_HOST_KEY }}
          TARGET_HOST: ${{ secrets.DEPLOY_TARGET_HOST }}
          TARGET_HOST_KEY: ${{ secrets.DEPLOY_TARGET_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          MISSING=0
          need() {
            if [ -z "${2:-}" ]; then
              echo "  MISSING $1"; echo "::error::$1 is unset on this repository."; MISSING=1
            else
              echo "  ok      $1"
            fi
          }
          need DEPLOY_SSH_KEY_B64     "$SSH_KEY_B64"
          need DEPLOY_SSH_USER        "$SSH_USER"
          need DEPLOY_JUMP_HOST       "$JUMP_HOST"
          need DEPLOY_TARGET_HOST     "$TARGET_HOST"

          add_key() {
            if printf '%s' "$2" | grep -q 'ssh-ed25519 AAAA'; then
              printf '%s\n' "$2" >> "$HOME/.ssh/known_hosts"
              echo "  ok      $1"
            else
              echo "  MISSING $1"
              echo "::error::$1 is unset or malformed (expected a line containing 'ssh-ed25519 AAAA')."
              MISSING=1
            fi
          }
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          add_key DEPLOY_JUMP_HOST_KEY   "$JUMP_HOST_KEY"
          add_key DEPLOY_TARGET_HOST_KEY "$TARGET_HOST_KEY"

          if [ "$MISSING" != "0" ]; then
            echo "::error::Set the missing ones at Settings > Secrets and variables > Actions on"
            echo "::error::this repository -- repository secrets, not environment secrets, not"
            echo "::error::variables. Names are case-sensitive. Print a host key on its own host:"
            echo '::error::  echo "<host-as-ssh-addresses-it> $(cut -d" " -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)"'
            exit 1
          fi

          printf '%s' "$SSH_KEY_B64" | base64 -d > "$HOME/.ssh/id_ci"
          chmod 600 "$HOME/.ssh/id_ci"

          cat > "$HOME/.ssh/config" <<EOF
          Host ci-jump
            HostName $JUMP_HOST
            Port 22
            User $SSH_USER
            IdentityFile ~/.ssh/id_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host target
            HostName $TARGET_HOST
            Port 22
            User $SSH_USER
            IdentityFile ~/.ssh/id_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyJump ci-jump
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Decide which sites to build
        run: |
          set -euo pipefail

          FORCE="${{ github.event.inputs.force }}"

          decide() {
            NAME="$1"; WANT="$2"
            if [ "$FORCE" = "true" ]; then
              echo "  $NAME: build (forced)"
              echo "BUILD_${3}=1" >> "$GITHUB_ENV"; return
            fi
            HAVE="$(ssh target "cat '$APP_BASE/$NAME/current/build-inputs' 2>/dev/null" | tr -d '[:space:]' || true)"
            if [ -n "$HAVE" ] && [ "$HAVE" = "$WANT" ]; then
              echo "  $NAME: SKIP (already serving inputs ${WANT:0:12})"
              echo "BUILD_${3}=0" >> "$GITHUB_ENV"
            else
              echo "  $NAME: build (serving '${HAVE:0:12}', want ${WANT:0:12})"
              echo "BUILD_${3}=1" >> "$GITHUB_ENV"
            fi
          }

          decide site   "$SITE_INPUTS"   SITE
          decide studio "$STUDIO_INPUTS" STUDIO
          decide play   "$PLAY_INPUTS"   PLAY

      - name: Install dependencies
        if: ${{ env.BUILD_SITE == '1' || env.BUILD_STUDIO == '1' || env.BUILD_PLAY == '1' }}
        run: npm ci

      - name: Build
        if: ${{ env.BUILD_SITE == '1' || env.BUILD_STUDIO == '1' || env.BUILD_PLAY == '1' }}
        run: |
          set -euo pipefail
          build_one() {
            NAME="$1"; DIR="$2"; WORKSPACE="$3"; INPUTS="$4"
            echo "::group::build $NAME"
            npm run build --workspace "$WORKSPACE" || {
              echo "::error::$NAME: the build failed for $WORKSPACE"; exit 1; }

            test -f "$DIR/out/index.html" || { echo "::error::$DIR/out/index.html missing after build"; exit 1; }
            ls "$DIR/out/_next/static" >/dev/null 2>&1 || { echo "::error::no _next/static in $DIR/out"; exit 1; }

            printf '%s\n' "$GIT_SHA" > "$DIR/out/build-id"
            printf '%s\n' "$INPUTS" > "$DIR/out/build-inputs"
            echo "::endgroup::"
          }

          if [ "$BUILD_SITE" = "1" ]; then
            build_one site apps/site @dm/site-app "$SITE_INPUTS"
          fi
          if [ "$BUILD_STUDIO" = "1" ]; then
            build_one studio apps/editor @dm/editor "$STUDIO_INPUTS"
          fi
          if [ "$BUILD_PLAY" = "1" ]; then
            build_one play apps/play @dm/play-app "$PLAY_INPUTS"
          fi

      - name: Ship and activate
        run: |
          set -euo pipefail
          ship() {
            NAME="$1"; DIR="$2"; BUILT="$3"
            if [ "$BUILT" != "1" ]; then echo "  $NAME: nothing to ship"; return; fi
            echo "::group::ship $NAME"

            ssh target "BASE='$APP_BASE/$NAME' REL='$RELEASE' bash -s" <<'REMOTE'
            set -euo pipefail
            [ -d "$BASE/releases" ] || {
              echo "::error::$BASE/releases does not exist -- run deploy/bootstrap.sh on the serving host once"
              exit 1; }
            mkdir -p "$BASE/releases/$REL"
          REMOTE

            rsync -az --delete -e ssh "./$DIR/out/" "target:$APP_BASE/$NAME/releases/$RELEASE/"

            ssh target "BASE='$APP_BASE/$NAME' REL='$RELEASE' bash -s" <<'REMOTE'
            set -euo pipefail
            REL_DIR="$BASE/releases/$REL"

            [ -f "$REL_DIR/index.html" ]   || { echo "::error::$REL_DIR/index.html missing after rsync"; exit 1; }
            [ -f "$REL_DIR/build-inputs" ] || { echo "::error::$REL_DIR/build-inputs missing after rsync"; exit 1; }

            ln -sfn "$REL_DIR" "$BASE/.current.tmp"
            mv -Tf "$BASE/.current.tmp" "$BASE/current"
            echo "current -> $(readlink -f "$BASE/current")"

            ls -1dt "$BASE"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf || true
          REMOTE
            echo "::endgroup::"
          }

          ship site   apps/site   "$BUILD_SITE"
          ship studio apps/editor "$BUILD_STUDIO"
          ship play   apps/play   "$BUILD_PLAY"

      - name: Verify each origin is serving the right build
        run: |
          set -euo pipefail

          ssh target "SITE='$SITE_INPUTS' STUDIO='$STUDIO_INPUTS' PLAY='$PLAY_INPUTS' bash -s" <<'REMOTE'
          set -euo pipefail
          FAIL=0
          check() {
            NAME="$1"; PORT="$2"; WANT="$3"; DEEP="$4"
            ORIGIN="http://127.0.0.1:$PORT"

            SERVED=""
            for i in $(seq 1 15); do
              SERVED="$(curl -fsS --max-time 5 "$ORIGIN/build-inputs" 2>/dev/null | tr -d '[:space:]' || true)"
              [ "$SERVED" = "$WANT" ] && break
              sleep 1
            done
            if [ "$SERVED" != "$WANT" ]; then
              echo "::error::$NAME ($ORIGIN) never served ${WANT:0:12} (last saw: '${SERVED:-<nothing>}')"
              FAIL=1; return
            fi
            echo "$NAME: serving ${WANT:0:12}"

            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$ORIGIN$DEEP" || echo 000)"
            [ "$CODE" = "200" ] || {
              echo "::error::$NAME: $DEEP returned $CODE, expected 200 -- the try_files line is missing from conf.d/dungeonmaster.caddy"
              FAIL=1; }
          }

          check site   8081 "$SITE"   /format.html
          check studio 8082 "$STUDIO" /
          check play   8083 "$PLAY"   /

          [ "$FAIL" = "0" ] || {
            systemctl is-active caddy || true
            journalctl -u caddy -n 40 --no-pager 2>/dev/null || true
            exit 1; }
          REMOTE

      - name: Check the public URLs
        run: |
          set -uo pipefail
          for pair in "dnddungeon.com:$SITE_INPUTS" "studio.dnddungeon.com:$STUDIO_INPUTS" "play.dnddungeon.com:$PLAY_INPUTS"; do
            HOST="${pair%%:*}"; WANT="${pair#*:}"
            SERVED="$(curl -fsS --max-time 15 "https://$HOST/build-inputs" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$SERVED" = "$WANT" ]; then
              echo "https://$HOST is serving ${WANT:0:12}"
            else
              echo "::warning::https://$HOST did not return ${WANT:0:12} (saw: '${SERVED:-<nothing>}')."
            fi
          done
          echo "::notice::If any of the three warned, check in order: the A records for @, studio"
          echo "::notice::and play resolve to the public IP; the three vhosts exist on the reverse"
          echo "::notice::proxy; dynamic DNS is still following the IP."
